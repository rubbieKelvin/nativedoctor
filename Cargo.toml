[workspace]
members = [
    "crates/*"
]
resolver = "2"

[workspace.package]
version = "0.3.0"
edition = "2021"
authors = ["rubbie kelvin <dev@gmail.com>"]

[workspace.dependencies]
nd-constants = { path = "crates/nd-constants" }
nd-core = { path = "crates/nd-core" }
nd-engine = { path = "crates/nd-engine" }

bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
colored = "3"
dotenvy = "0.15"
fake = "5"
futures-util = "0.3"
globset = "0.4"
indexmap = { version = "2", features = ["serde"] }
mime_guess = "2"
nanoid = "0.5"
rand = "0.10"
regex = "1"
reqwest = { version = "0.13", features = ["multipart", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "arbitrary_precision"] }
serde_json_path = "0.7"
serde_yaml_ng = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "rt-multi-thread", "sync", "time"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
walkdir = "2"
wiremock = "0.6"

[workspace.lints.clippy]
needless_return = "allow"
